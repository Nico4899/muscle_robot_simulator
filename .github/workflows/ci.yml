# spec 04: make test numbers recheck on every push (not mutation testing: too slow), then, on
# main only, build the public page (with the trimmed clip page/s11small.mp4) and serve it with
# GitHub Pages.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: make test numbers recheck

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python build.py
      - run: "! grep -q 'data:image' dist/public/index.html"  # the lab's logo stays off the public page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - id: deploy
        uses: actions/deploy-pages@v4
