# mutmut (spec 02): mutate the reference, kill mutants with the physics invariants only.
# No oracle or parity test here: each mutant is a mistake shared by reference and port.
[mutmut]
source_paths =
    statics.py
    model.py
also_copy =
    rng.py
pytest_add_cli_args_test_selection =
    tests/test_physics.py
pytest_add_cli_args =
    -x
    -q
